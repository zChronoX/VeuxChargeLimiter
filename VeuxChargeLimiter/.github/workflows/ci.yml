name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (script del modulo, POSIX sh)
        run: shellcheck -s sh module/*.sh module/META-INF/com/google/android/update-binary
      - name: ShellCheck (strumenti, bash)
        run: shellcheck tools/build.sh tools/test/run-tests.sh
      - name: Sintassi mksh e BusyBox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mksh busybox
          for f in module/*.sh; do mksh -n "$f" && busybox sh -n "$f"; done
      - name: Coerenza versioni (module.prop, update.json, CHANGELOG)
        run: bash tools/build.sh --check

  test:
    name: Test (mksh + BusyBox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dipendenze
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mksh busybox
      - name: Test con sysfs simulato
        run: bash tools/test/run-tests.sh

  build:
    name: Build zip
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash tools/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VeuxChargeLimiter-build-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 14

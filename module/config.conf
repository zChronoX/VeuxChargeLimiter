# ==============================================================================
# Veux Smart Charge Limiter - Configurazione (Redmi Note 11 Pro 5G / veux)
# Puoi modificare questo file in qualsiasi momento (senza riavviare!): il demone
# lo rilegge appena cambia. Puoi anche usare la WebUI o il pulsante Azione.
# Solo numeri interi. Le righe che iniziano con # sono commenti.
# ==============================================================================

# 1 = Modulo attivo | 0 = Pausa (ripristina carica e velocità normali)
ENABLED=1

# ---------------------------------------------------------------- Soglie -----
# Soglia massima (%): raggiunta questa, la carica viene SOSPESA
MAX_LEVEL=80

# Soglia minima (%): se il telefono resta collegato in sospensione, la carica
# riparte quando scende qui. Minimo assoluto 15.
# Consiglio per telefono sempre in carica (H24): MIN 75 / MAX 80, così la
# batteria fa micro-cicli invece di cicli profondi 80->20 ogni giorno.
MIN_LEVEL=20

# 1 = quando COLLEGHI il cavo e la batteria è sotto (MAX_LEVEL - PLUG_RESUME_DELTA)
#     la carica parte subito, anche se il ciclo era "in scarica" verso MIN_LEVEL.
# 0 = comportamento classico: si ricarica solo sotto MIN_LEVEL.
CHARGE_ON_PLUG=1
PLUG_RESUME_DELTA=5

# -------------------------------------------------------------- Corrente -----
# Limite corrente di ricarica in mA:
#   2500 = ricarica dolce (~12W, batteria fresca)
#   0    = velocità piena originale Xiaomi (fino a 67W)
MAX_CHARGE_MA=2500

# ----------------------------------------------------- Protezione termica -----
# Sopra TEMP_SOFT_C la corrente scende a SOFT_CHARGE_MA (0 = disattivato)
TEMP_SOFT_C=36
SOFT_CHARGE_MA=1500

# Sopra TEMP_STOP_C la carica si ferma; riprende sotto TEMP_RESUME_C
TEMP_STOP_C=39
TEMP_RESUME_C=35

# -------------------------------------------------------- Carica al 100% -----
# Carica al 100% una tantum: metti 1 se oggi ti serve il telefono pieno.
# Raggiunto il 100% torna da solo a 0. Scade comunque dopo FORCE_FULL_EXPIRE_H
# ore (0 = mai), così non resta attivo per sbaglio.
FORCE_FULL_ONCE=0
FORCE_FULL_EXPIRE_H=24

# Carica smart: di notte tiene la soglia MAX e riparte in tempo per arrivare al
# 100% all'ora della sveglia (solo se il telefono è collegato).
#   SMART_CHARGE=1      attiva
#   SMART_FIXED_TIME=0  usa la prossima sveglia dell'app Orologio
#   SMART_FIXED_TIME=730 usa un orario fisso (HHMM, qui 07:30)
#   SMART_BUFFER_MIN    margine extra in minuti per arrivare pieno in tempo
SMART_CHARGE=0
SMART_FIXED_TIME=0
SMART_BUFFER_MIN=30

# ----------------------------------------------------------------- Altro -----
# 1 = notifiche Android per gli eventi (soglia raggiunta, pausa termica, ...)
NOTIFY=1

# Ogni quanti minuti salvare un campione nelle statistiche (CSV)
STATS_INTERVAL_MIN=5

# Intervalli di controllo (in secondi)
POLL_CHARGING_SEC=25
POLL_DISCHARGING_SEC=60
POLL_UNPLUGGED_SEC=20
